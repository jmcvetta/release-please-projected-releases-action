# Typecheck, test, and prove the committed bundle is the source.
#
# The last of those is the one a JavaScript action needs and a library does
# not. `dist/index.mjs` is what callers actually run, so a pull request that
# changes src/ without rebuilding ships nothing: the tests pass, review passes,
# and the action keeps running the old code. Rebuilding here and failing on a
# diff makes that impossible to merge by accident.
#
# The test leg also measures coverage here and leaves it as a comment on the
# pull request. Coverage is a flag the ordinary test script reads rather than
# a script of its own, so the thing CI measures stays the thing a laptop runs.
name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # pull-requests: write lets the coverage step below maintain its sticky
    # comment; everything else keeps the read-only default above.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # Before the tests, not after: src/bundle.test.ts runs dist/index.mjs in
      # a subprocess, so testing first would measure the committed bundle
      # rather than the source this pull request changed.
      - name: Rebuild the bundle
        run: npm run build
      - name: Fail if the committed bundle is not the source
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/index.mjs is stale. Run \`npm run build\` and commit it." >&2
            git diff --stat -- dist >&2
            exit 1
          fi

      # The same test leg as a laptop runs, with coverage switched on by the
      # variable the script reads. Not a second script that restates this
      # command line: a copy has no way to notice when the original grows a
      # leg, and CI running the copy is how a sibling repository left 1045
      # tests unrun behind a green required check.
      - run: npm test
        env:
          VITEST_COVER: --coverage

      # What this change left uncovered, as one sticky comment on the pull
      # request. Diff-aware on purpose -- `file-coverage-mode: changes`, its
      # default -- because a repository-wide percentage is read once and then
      # never again, while "these lines you just wrote are untested" is about
      # the change under review.
      #
      # It keys on its own hidden marker, under a name distinct from the
      # `projected-releases` header that projected-releases.yml sticks on the
      # same pull request under the same bot identity. Two sticky comments
      # that matched on "my newest comment" instead would overwrite each
      # other's body on every push.
      #
      # Skipped for pull requests from forks, where GITHUB_TOKEN is read-only
      # by design and the write below would fail the check over something the
      # contributor cannot fix. The coverage report is still in the log above.
      #
      # MIT-licensed, and pinned by commit SHA (v2.9.3) rather than by tag: a
      # tag can be moved onto different code, a SHA cannot.
      - name: Comment the coverage this change leaves
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@2500dafcee7dd64f85ab689c0b83798a8359770e # v2.9.3
        with:
          name: coverage

      # The bundle is where this action fails in the way nothing else catches.
      # esbuild leaves the CommonJS `require` calls it cannot resolve to a stub
      # that throws, and release-please's logger reaches one on load, so a
      # broken bundle dies before any of it runs. Every unit test above passes
      # against src/, which does not exercise the bundle at all.
      #
      # Running it with nothing reaches the first thing it checks, which means
      # the whole module graph loaded.
      #
      # `env -i` is load-bearing, not tidiness. A runner sets GITHUB_REPOSITORY
      # and GITHUB_EVENT_PATH, which the action reads as its defaults, so
      # inheriting the environment moves which input check fires first and the
      # assertion below stops describing anything. Isolating it makes the
      # answer the same here as on a laptop.
      - name: Prove the bundle loads
        run: |
          set +e
          output=$(env -i PATH="$PATH" node dist/index.mjs 2>&1)
          status=$?
          set -e
          echo "$output"
          if [[ $status -eq 0 ]]; then
            echo "::error::the bundle should have failed on a missing repository" >&2
            exit 1
          fi
          # The regression this exists for. esbuild leaves the CommonJS
          # `require` calls it cannot resolve to a stub that throws, and the
          # message is distinctive.
          if grep -qE "Dynamic require of|ERR_MODULE_NOT_FOUND|Cannot find package" <<<"$output"; then
            echo "::error::the bundle did not load: see the message above" >&2
            exit 1
          fi
          if ! grep -q "could not determine the repository" <<<"$output"; then
            echo "::error::the bundle did not reach its own input checks" >&2
            exit 1
          fi
