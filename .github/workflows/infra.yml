# Parse infra/github/*.tf before a person does.
#
# Nothing else in this repository reads those files: the stack is applied by
# hand, because CI holds no GitHub-admin credentials and so cannot run `plan`.
# Without this workflow the first thing to parse the configuration would be
# someone mid-`tofu apply` against live branch protection. `check:infra` moves
# that discovery here, and needs no credentials: `tofu init -backend=false`
# fetches the provider without touching state or the GitHub API.
#
# It is its own workflow rather than a leg of test.yml so that `paths:` below
# can gate it. That block is GitHub's own filter, evaluated before a runner is
# allocated, so a change to src/ starts nothing here at all -- no job, no
# skipped check, no third-party action reading the diff. The cost being avoided
# is the two downloads: a toolchain from setup-opentofu and the GitHub provider
# from the registry, on every push, for a directory that changes a few times a
# year.
#
# The filter is the leg's real input set rather than its directory: `tofu
# validate` reads infra/**, and package.json holds the `check:infra` command
# line. Not this file -- nothing here reads it.
#
# Safe to gate this way only because `infra` is not a required check. The
# ruleset requires `validate-title` and nothing else, and that workflow carries
# no `paths:` filter for exactly this reason: a path-filtered workflow does not
# report a skipped check, it reports nothing, and a required check that never
# reports leaves every pull request pending forever. So requiring this one
# means dropping the filter first. Nothing checks that. test.yml is filtered
# for the same reason and carries the same condition.
name: Infra

on:
  push:
    branches: [master]
    paths:
      - infra/**
      - package.json
  pull_request:
    paths:
      - infra/**
      - package.json

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `npm ci`. `check:infra` shells out to `tofu` and reaches for no
      # dependency, so the npm on the runner is enough to read the script out
      # of package.json.
      #
      # The version comes from infra/github/.opentofu-version, which is also
      # what a version manager reads on a laptop, so CI and a developer install
      # the same OpenTofu from the same pin.
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: infra/github/.opentofu-version
          # The default wrapper replaces `tofu` with a script that swallows
          # exit codes to republish them as step outputs, which would make a
          # failing `fmt -check` or `validate` report green.
          tofu_wrapper: false
      - name: tofu fmt, init and validate
        run: npm run check:infra

      # After the step above, and only works there. `check:infra` runs
      # `tofu init`, which rewrites .terraform.lock.hcl in place; this step
      # asks git what that rewrite changed. Run first, it would diff a clean
      # checkout against itself and pass every time.
      #
      # A lock file that init would rewrite is not a pin anyone is reading:
      # every init offers a diff nobody meant to make, and the habit is to
      # commit it unread. Measured on this repository: initialising against the
      # registry records an `h1:` hash for every platform the provider
      # publishes, so a lock carrying one platform's hash is rewritten on the
      # next init. This step fails on that and prints the diff, which is the
      # fix.
      - name: Lockfile staleness check
        run: |
          if ! git diff --quiet -- infra/github/.terraform.lock.hcl; then
            echo "::error::infra/github/.terraform.lock.hcl is stale. See the diff below." >&2
            git diff -- infra/github/.terraform.lock.hcl >&2
            exit 1
          fi
