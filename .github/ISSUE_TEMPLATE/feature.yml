name: Feature request
description: Something the action should do and does not.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out on a pull request?
      description: >-
        The problem rather than the feature, if you can — this action exists to
        answer a question before a merge, and the useful framing is usually
        which question is going unanswered.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which release-please mode?
      options:
        - Manifest mode
        - Plain mode
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind, if anything
    validations:
      required: false
